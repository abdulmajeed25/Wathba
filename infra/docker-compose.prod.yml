# Wathba production stack (Sprint 4 / P0-1101).
# Secrets come from .env.prod next to this file — never commit it.
services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: wathba
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redisdata:/data

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?}
    volumes:
      - miniodata:/data

  api:
    image: wathba-api:${TAG:-latest}
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "4000"
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/wathba?schema=public
      REDIS_URL: redis://redis:6379
      CORS_ORIGINS: ${WEB_ORIGIN:?}
      WEB_BASE_URL: ${WEB_ORIGIN}
      JWT_SECRET: ${JWT_SECRET:?}
      JWT_EXPIRES_IN: 1h
      MOYASAR_API_KEY: ${MOYASAR_API_KEY:-}
      MOYASAR_WEBHOOK_SECRET: ${MOYASAR_WEBHOOK_SECRET:-}
      NAFATH_API_KEY: ${NAFATH_API_KEY:-}
      ZATCA_SELLER_VAT: ${ZATCA_SELLER_VAT:-}
      PAYOUT_PROVIDER_KEY: ${PAYOUT_PROVIDER_KEY:-}
    ports:
      - "127.0.0.1:4000:4000"

  web:
    image: wathba-web:${TAG:-latest}
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${API_ORIGIN:?}
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NODE_ENV: production
      API_BASE_URL: http://api:4000
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  pgdata:
  redisdata:
  miniodata:
